name: Build CastVector Play Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Recreate CastVector Android source
        env:
          SRC_B64: ${{ secrets.CASTVECTOR_ANDROID_SOURCE_BASE64 }}
        run: |
          test -n "$SRC_B64" || (echo "Missing CASTVECTOR_ANDROID_SOURCE_BASE64 secret" && exit 1)
          echo "$SRC_B64" | base64 --decode > source.zip
          unzip -q source.zip
          mv cv_android_source_secret android-app

      - name: Create branded launcher icons
        run: |
          WEB_URL=$(grep '^CASTVECTOR_WEB_URL=' android-app/gradle.properties | cut -d= -f2-)
          WEB_URL="${WEB_URL%/}"
          curl -fsSL "$WEB_URL/icon-512.png" -o /tmp/castvector-icon.png
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $item
            mkdir -p "android-app/app/src/main/res/mipmap-$1"
            convert /tmp/castvector-icon.png -resize "$2x$2" "android-app/app/src/main/res/mipmap-$1/ic_launcher.png"
          done

      - name: Configure private upload signing key
        env:
          KS_B64: ${{ secrets.CASTVECTOR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CASTVECTOR_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.CASTVECTOR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CASTVECTOR_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" || (echo "Missing CASTVECTOR_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KS_B64" | base64 --decode > android-app/castvector-upload.jks
          cat > android-app/keystore.properties <<EOF
          storeFile=castvector-upload.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug

      - name: Build signed release AAB
        working-directory: android-app
        run: gradle :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CastVector-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: CastVector-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
