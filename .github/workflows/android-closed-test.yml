name: Build CastVector 5.6.1 Android Closed Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout CastVector
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify release source
        run: |
          grep -F "applicationId 'com.castvector.fishing'" android-native/app/build.gradle
          grep -F "targetSdk 36" android-native/app/build.gradle
          grep -F "versionCode 56101" android-native/app/build.gradle
          grep -F "versionName '5.6.1'" android-native/app/build.gradle
          grep -F "castvector_premium_monthly" android-native/app/build.gradle
          grep -F "com.android.billingclient:billing:8.3.0" android-native/app/build.gradle
          test -f android-native/app/src/main/java/com/castvector/fishing/BillingManager.java
          echo "VERIFIED: billing-enabled CastVector 5.6.1 Android source"

      - name: Build debug APK
        run: gradle -p android-native clean :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CastVector-5.6.1-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Restore private upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android-native
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > castvector-upload.jks
          cat > keystore.properties <<EOF
          storeFile=castvector-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Google Play AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: gradle -p android-native :app:bundleRelease --no-daemon --stacktrace

      - name: Upload signed closed-test AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CastVector-5.6.1-closed-test-aab
          path: android-native/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
